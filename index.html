<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Red Thread — Marvel movies, series and character connections</title>
<!-- The name iOS offers for a home-screen icon; without it, it offers the
     whole title above. -->
<meta name="apple-mobile-web-app-title" content="Red Thread"/>
<!-- Tab, home-screen and link-preview identity. Crawlers do not run scripts,
     so the description is the English default; the app itself follows the
     visitor's language. The preview image is drawn by the build
     (scripts/og-previews.js), and a shared title, character or guide link
     gets its own (middleware.ts). -->
<meta name="description" content="See how every Marvel Cinematic Universe film and series connects through shared characters, and track what you have watched."/>
<!-- The browser's own chrome, per system scheme: the design system's
     --background in each theme. -->
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)"/>
<!-- Search results show a favicon only in a multiple of 48px, and ask for
     /favicon.ico regardless (Notion "Findability 13"); tools/make-icons.js. -->
<link rel="icon" href="/favicon.ico" sizes="48x48"/>
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png"/>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Red Thread"/>
<meta property="og:title" content="Red Thread"/>
<meta property="og:description" content="See how every Marvel Cinematic Universe film and series connects through shared characters."/>
<meta property="og:url" content="https://redthread.tv/"/>
<meta property="og:image" content="https://redthread.tv/og/default.jpg"/>
<meta property="og:image:type" content="image/jpeg"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="Marvel films and series drawn as cards, joined by the characters they share"/>
<meta property="og:locale" content="en_US"/>
<meta property="og:locale:alternate" content="pt_BR"/>
<meta name="twitter:card" content="summary_large_image"/>
<!-- X reads these before the og: tags; kept equal to them (meta.ts sets both
     on every preview page) so it never shows anything stale. -->
<meta name="twitter:title" content="Red Thread"/>
<meta name="twitter:description" content="See how every Marvel Cinematic Universe film and series connects through shared characters."/>
<meta name="twitter:image:alt" content="Marvel films and series drawn as cards, joined by the characters they share"/>
<!-- The one public address: the old mcu-connections.vercel.app redirects here
     (vercel.json), and each shared link's page names its own (meta.ts). -->
<link rel="canonical" href="https://redthread.tv/"/>
<!-- No web fonts from Google: the UI's Inter is the design system's, served
     with the bundle, and numbers use the system monospace. (Bebas Neue, the
     old fallback posters' face, loaded here until Notion "Findability 8":
     nothing had used it since the Monogram posters, and its stylesheet
     held up every first paint.) -->
<!-- Root-relative, as every local file below: the page is also served at
     /guides/<id>, /titles/<id> and /characters/<id> (middleware.ts), where a
     relative path would point inside that folder. -->
<script src="/boot.js"></script>
<!-- The classic scripts the bundle reads, deferred (Notion "Findability 8"):
     the browser fetches them at once but no longer stops drawing the page to
     wait for each, so the startup screen paints while they download. Deferred
     scripts run in the order written, and Vite puts the bundle's module
     script after these at the end of <head>, so the order the app relies on
     is unchanged: the languages, the runtime, supabase-js, watch-data.js,
     then the bundle. -->
<!-- Languages first (small, local): the startup screen speaks the visitor's
     language while the bundle downloads. One catalog per file (English is
     the base), then the runtime. -->
<script defer src="/locales/en.js"></script>
<script defer src="/locales/pt-BR.js"></script>
<script defer src="/i18n.js"></script>
<script defer src="https://unpkg.com/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous"></script>
<script defer src="/watch-data.js"></script>
</head>
<body>
<div id="root">
  <div id="mcu-boot" class="boot group flex min-h-screen min-h-dvh flex-col items-center justify-center gap-4 p-6 text-center" data-state="loading" role="status" aria-live="polite">
    <div class="boot-mark logo-mark size-[48px]" aria-hidden="true"></div>
    <div class="boot-spinner size-[22px] animate-[boot-spin_0.9s_linear_infinite] rounded-full border-2 border-muted border-t-foreground group-data-[state=failed]:hidden motion-reduce:[animation-duration:2.4s]" aria-hidden="true"></div>
    <p class="boot-msg m-0 min-h-[1.4em] max-w-80 text-sm leading-[1.45] text-muted-foreground"></p>
    <button class="boot-reload h-9 min-h-9 cursor-pointer rounded-md border bg-background px-[18px] text-sm font-medium text-foreground shadow-xs outline-none hover:bg-muted focus-visible:ring-3 focus-visible:ring-ring/50 dark:border-input dark:bg-input/30 dark:hover:bg-input/50" type="button" hidden></button>
  </div>
</div>

<!-- The whole app is one bundle now (src/main.js): React, the data layer and
     every view. The build moves this tag to the end of <head>, after the
     deferred scripts there, and a module script is deferred too, so it runs
     after them, which is what the app expects. -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
